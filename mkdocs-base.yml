      - 1. Install: 
          - apt.md
          - yum.md
          - tarball.md
          -  docker.md
          - enable-extensions.md
          - repo-overview.md
      - 2. Connect to PostgreSQL: 
          - connect.md
      - 3. Manipulate data in PostgreSQL: 
          - crud.md  
      - 4. What's next: 
          - whats-next.md 
  - Extensions:
      - extensions.md
      - contrib.md
      - percona-ext.md
      - third-party.md
  - Solutions:
      - solutions.md
      - High availability:
          - solutions/high-availability.md
          - solutions/ha-setup-apt.md
          - solutions/ha-setup-yum.md
          - solutions/pgbackrest.md
          - solutions/ha-test.md
      - Backup and disaster recovery:
          - solutions/backup-recovery.md
          - solutions/dr-pgbackrest-setup.md
      - Spatial data handling:
        - solutions/postgis.md
        - solutions/postgis-deploy.md
        - solutions/postgis-testing.md
        - solutions/postgis-upgrade.md
      - ldap.md
  - Upgrade:
      - major-upgrade.md
      - minor-upgrade.md
      - migration.md
  - troubleshooting.md
  - uninstalling.md
  - release-notes.md
  - release-notes-v17.5.md
  - release-notes-v17.4.md
  - release-notes-v17.2.md
  - release-notes-v17.0.md
  - telemetry.md
  - licensing.md
  - trademark-policy.md



