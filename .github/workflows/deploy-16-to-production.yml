name: Deploy PostgreSQL 16 docs to production

# Manual only. Pushes/merges to branch 16 do NOT publish anymore.
# The postgresql-docs-preview-16 Render service already rebuilds
# automatically on every push to that branch -- use that to review
# changes. Run this by hand (Actions tab -> this workflow -> Run
# workflow) when you want this version to go live. It always checks
# out branch 16 itself (pinned below), regardless of which branch
# you happen to have selected when dispatching, then pushes the built
# docs into the `publish` branch, which the production Render site
# serves.
on:
  workflow_dispatch:

jobs:
  build:
    name: Deploy docs
    runs-on: ubuntu-latest

    steps: 
      #Pull the latest changes
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: '16'
          fetch-depth: 0
      #Prepare the env
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.x'
      
      #Configure git
      - name: Configure git
        env:
          ROBOT_TOKEN: ${{ secrets.ROBOT_TOKEN }}
        run: |
          git config --global url."https://percona-platform-robot:${ROBOT_TOKEN}@github.com".insteadOf "https://github.com"
          git config user.name "GitHub Action"
          git config user.email "github-action@users.noreply.github.com"
          git config user.password "${ROBOT_TOKEN}"
          echo "GIT_USER=percona-platform-robot:${ROBOT_TOKEN}" >> $GITHUB_ENV

      #Set up MkDocs
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

     # Deploy docs
      - name: Deploy docs
        run: |
          TITLE=$(python3 -c "import yaml; print(yaml.safe_load(open('variables.yml'))['dockertag'])")
          mike deploy 16 -b publish -p
          mike retitle 16 "$TITLE" -b publish -p
