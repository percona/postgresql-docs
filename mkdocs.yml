# MkDocs configuration for builds with material theme

INHERIT: mkdocs-base.yml

site_url: "https://docs.percona.com/postgresql/"

theme:
  name: material
  custom_dir: _resourcepdf/overrides/

extra:
  analytics:
    provider: google
    property: G-J4J70BNH0G

nav:
  - 'Home': 'index.md'
  - 'Percona Server for PostgreSQL': postgresql-server.md
  - get-help.md
  - Quickstart guide: quick-start.md
  - Get started: 
      - 1. Install:
          - Overview: installing.md  
          - Via apt: apt.md
          - Via yum: yum.md
          - From tarballs: tarball.md
          - Run in Docker: docker.md
          - enable-extensions.md
          - repo-overview.md
          - sboms.md
      - 2. Connect to PostgreSQL: connect.md
      - 3. Manipulate data in PostgreSQL: crud.md  
      - 4. What's next: whats-next.md 
  - Extensions:
      - 'Extensions': extensions.md
      - contrib.md
      - Percona-authored extensions: percona-ext.md
      - third-party.md
  - Solutions:
      - Overview: solutions.md
      - High availability:
          - 'Overview': 'solutions/high-availability.md'
          - solutions/ha-measure.md
          - 'Architecture': solutions/ha-architecture.md
          - Components:
            - 'ETCD': 'solutions/etcd-info.md'
            - 'Patroni': 'solutions/patroni-info.md'
            - 'HAProxy': 'solutions/haproxy-info.md'
            - 'pgBackRest': 'solutions/pgbackrest-info.md'
          - solutions/ha-components.md
          - Deployment:
              - 'Initial setup': 'solutions/ha-init-setup.md'
              - 'etcd setup': 'solutions/ha-etcd-config.md'
              - 'Patroni setup': 'solutions/ha-patroni.md'
              - solutions/pgbackrest.md
              - 'HAProxy setup': 'solutions/ha-haproxy.md'
          - solutions/ha-test.md
      - Backup and disaster recovery:
          - 'Overview': 'solutions/backup-recovery.md'
          - solutions/dr-pgbackrest-setup.md
      - Data encryption:
          - 'TDE compatibility with tools and extensions': solutions/tde-tools-compatibility.md
      - Spatial data handling:
        - Overview: solutions/postgis.md
        - Deployment: solutions/postgis-deploy.md
        - Query spatial data: solutions/postgis-testing.md
        - Upgrade spatial database: solutions/postgis-upgrade.md
      - LDAP authentication:
          - ldap.md
  - Upgrade:
      - "Major upgrade": major-upgrade.md
      - minor-upgrade.md
      - migration.md
  - FAQ: faq.md  
  - Troubleshooting guide: 
      - "Overview": troubleshooting.md
      - "Repository 404 errors and removed versions": remove-repo-ver.md
  - Uninstall: uninstalling.md
  - Release notes:
      - "Release notes index": release-notes/release-notes.md
      - "17.9.1": release-notes/release-notes-v17.9.1.md
      - 2025 (versions 17.4.1 - 17.7.1):
        - "17.7.1": release-notes/release-notes-v17.7.1.md
        - "17.6.1": release-notes/release-notes-v17.6.1.md
        - "17.5.3": release-notes/release-notes-v17.5.3.md
        - "17.5.2": release-notes/release-notes-v17.5.md
        - "17.5.1": release-notes/release-notes-v17.5.1.md
        - "17.4.1": release-notes/release-notes-v17.4.md
      - 2024 (versions 17.0.1 - 17.2.1):
        - "17.2.1": release-notes/release-notes-v17.2.md
        - "17.0.1": release-notes/release-notes-v17.0.md
  - Reference:
      - Telemetry: telemetry.md
      - Licensing: licensing.md
      - Versioning: versioning.md
      - Trademark policy: trademark-policy.md
